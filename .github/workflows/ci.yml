name: CI Pipeline

on:
  pull_request:
    branches:
        - main
  push:
    branches: 
        - "**"

env:
  IMAGE_NAME: team2-back-app-pipeline
  ACR_NAME: academyacrj3r5dv
  ACR_RESOURCE_GROUP: rg-academy-acr
  AZURE_CLIENT_ID: ${{ secrets.CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}

jobs:
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup

        - name: Run Biome Linting
          run: npm run lint

        - name: Run Biome Formatting Check
          run: npm run format:check

    test:
        needs: code-quality
        runs-on: ubuntu-latest
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup

        - name: Generate Prisma Client
          run: DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" npx prisma generate

        - name: Run Tests with Coverage
          env:
            DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
            JWT_SECRET: "test-secret-key-for-ci-testing-minimum-32-chars"
            JWT_EXPIRES_IN: "24h"
          run: npm run test:coverage
    
    build:
        needs: test
        runs-on: ubuntu-latest
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup
        
        - name: Generate Prisma Client
          run: DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" npx prisma generate

        - name: Build Application
          run: npm run build

    containerise:
        needs: build
        runs-on: ubuntu-latest
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Build Docker Image
          run: |
            docker build --build-arg DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" -t ${{ env.IMAGE_NAME }}:latest .

        - name: Azure Login (Service Principal)
          uses: azure/login@v2
          with:
            client-id: ${{ env.AZURE_CLIENT_ID }}
            tenant-id: ${{ env.AZURE_TENANT_ID }}
            subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

        - name: Login to Azure Container Registry
          run: az acr login --name ${{ env.ACR_NAME }}

        - name: Resolve ACR Login Server
          id: acr
          run: |
            LOGIN_SERVER=$(az acr show --name ${{ env.ACR_NAME }} --resource-group ${{ env.ACR_RESOURCE_GROUP }} --query loginServer -o tsv)
            echo "login_server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"

        - name: Tag Docker Image
          run: |
            docker tag ${{ env.IMAGE_NAME }}:latest ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest
            docker tag ${{ env.IMAGE_NAME }}:latest ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

        - name: Push Docker Image
          run: |
            docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:latest
            docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}