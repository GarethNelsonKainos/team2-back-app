name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

# Cancel any in-progress run on the same branch when a new push arrives.
# This stops redundant runs stacking up when you push several commits quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────
  # Stage 1 (parallel): code-quality + test
  # These two jobs are completely independent — there is no reason for one
  # to wait on the other, so GitHub will run them simultaneously on two
  # separate runners.
  # ─────────────────────────────────────────────

  code-quality:
    name: "Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Run Biome Linting
        run: npm run lint

      - name: Run Biome Formatting Check
        run: npm run format:check

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    # No 'needs' here — runs in parallel with code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Generate Prisma Client
        run: DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" npx prisma generate

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          JWT_SECRET: "test-secret-key-for-ci-testing-minimum-32-chars"
          JWT_EXPIRES_IN: "24h"
        run: npm run test:coverage

  # ─────────────────────────────────────────────
  # Stage 2: compile TypeScript
  # Waits for BOTH stage-1 jobs. Using an array in 'needs' means GitHub only
  # proceeds here if every listed job succeeded — one failure blocks the rest.
  # ─────────────────────────────────────────────

  build:
    name: "Build (TypeScript)"
    needs: [code-quality, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup

      - name: Generate Prisma Client
        run: DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" npx prisma generate

      - name: Compile TypeScript
        run: npm run build

  # ─────────────────────────────────────────────
  # Stage 3: build Docker image
  # Only runs once the TypeScript compiles cleanly. No point spending 2-4
  # minutes on a Docker build for broken code.
  # ─────────────────────────────────────────────

  docker-build:
    name: "Build (Docker)"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Decide whether this run should push to ACR.
      # Rule: only push when a commit lands on main via a direct push (not a PR).
      # A pull_request event targeting main should build and validate, but NOT push —
      # unreviewed code should never reach the registry.
      #
      # We also compute the short SHA here and write the full tag list to
      # $GITHUB_OUTPUT so the build step can consume it cleanly.
      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          # Determine if this is a push to main (the only case we publish to ACR)
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            IS_MAIN_PUSH=true
          else
            IS_MAIN_PUSH=false
          fi
          echo "is_main_push=$IS_MAIN_PUSH" >> $GITHUB_OUTPUT

          # Build the tag list.
          # On any branch: local tags for build verification.
          # On main push only: also tag with the ACR registry prefix so the
          #   build-push-action knows where to send them.
          #   Three ACR tags are applied:
          #     :<full-sha>   immutable, traceable to an exact commit
          #     :<short-sha>  human-readable
          #     :latest       convenience pointer, always reflects current main
          TAGS="team2-back-app:${GITHUB_SHA}\nteam2-back-app:${SHORT_SHA}"

          if [[ "$IS_MAIN_PUSH" == "true" ]]; then
            TAGS="$TAGS\n${{ secrets.ACR_LOGIN_SERVER }}/team2-back-app:${GITHUB_SHA}"
            TAGS="$TAGS\n${{ secrets.ACR_LOGIN_SERVER }}/team2-back-app:${SHORT_SHA}"
            TAGS="$TAGS\n${{ secrets.ACR_LOGIN_SERVER }}/team2-back-app:latest"
          fi

          # Write multi-line output using the heredoc syntax GitHub requires
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Login only happens on main-branch pushes — secrets are not accessed on PRs.
      # Authentication uses a Service Principal scoped to AcrPush on this registry:
      #   ACR_LOGIN_SERVER  = academyacrj3r5dv.azurecr.io
      #   ACR_USERNAME      = Service Principal App (client) ID
      #   ACR_PASSWORD      = Service Principal client secret
      # Set these in: GitHub repo → Settings → Secrets and variables → Actions
      - name: Login to Azure Container Registry
        if: steps.meta.outputs.is_main_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Single build step handles both cases:
      #   PR / feature branch  → push: false, load: true  (image stays on runner for inspection)
      #   main push            → push: true,  load: false (image goes straight to ACR)
      #
      # GHA cache (cache-from/cache-to) means repeated pushes that don't change
      # dependencies or source files reuse cached layers — typically 60-90s saved.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.meta.outputs.is_main_push == 'true' }}
          load: ${{ steps.meta.outputs.is_main_push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Verify the image is in the local daemon — only meaningful on PR/branch builds
      # where load: true put it there. On main the image is in ACR, not the local daemon.
      - name: Confirm image built (PR / feature branch)
        if: steps.meta.outputs.is_main_push != 'true'
        run: docker image inspect team2-back-app:${{ env.SHORT_SHA }}