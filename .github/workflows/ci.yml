name: CI Pipeline

on:
  pull_request:
    branches:
        - main
  push:
    branches: 
        - "**"

env:
  IMAGE_NAME: team2-back-app-pipeline

jobs:
    code-quality:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup

        - name: Run Biome Linting
          run: npm run lint

        - name: Run Biome Formatting Check
          run: npm run format:check

    test:
        needs: code-quality
        runs-on: ubuntu-latest
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup

        - name: Generate Prisma Client
          run: DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" npx prisma generate

        - name: Run Tests with Coverage
          env:
            DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
            JWT_SECRET: "test-secret-key-for-ci-testing-minimum-32-chars"
            JWT_EXPIRES_IN: "24h"
          run: npm run test:coverage
    
    build:
        needs: test
        runs-on: ubuntu-latest
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup Node and Dependencies
          uses: ./.github/actions/setup
        
        - name: Generate Prisma Client
          run: DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" npx prisma generate

        - name: Build Application
          run: npm run build

    containerise:
        needs: build
        runs-on: ubuntu-latest
        
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Build Docker Image
          run: |
            docker build --build-arg DATABASE_URL="postgresql://dummy:dummy@localhost/dummy" -t ${{ env.IMAGE_NAME }}:latest .

        - name: Azure Login (Service Principal)
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.CLIENT_ID }}
            tenant-id: ${{ secrets.TENANT_ID }}
            subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

        - name: Login to Azure Container Registry
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          run: az acr login --name $(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d'.' -f1)

        - name: Tag Docker Image
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          run: |
            docker tag ${{ env.IMAGE_NAME }}:latest ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            docker tag ${{ env.IMAGE_NAME }}:latest ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

        - name: Push Docker Image
          if: github.event_name == 'push' && github.ref == 'refs/heads/main'
          run: |
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}