services:
  backend:
    container_name: team2-back-app
    build:
      context: .
      args:
        PORT: ${PORT:-3000}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - -e
      - "process.env.DATABASE_URL=(process.env.DATABASE_URL||'').replace('@localhost:','@host.docker.internal:');require('./dist/index.js')"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    networks:
      - team2-network

networks:
  team2-network:
    external: true
